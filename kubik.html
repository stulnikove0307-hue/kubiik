<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кубик 1‑2‑3</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: #f0f0f0;
            font-family: Arial, sans-serif;
        }
        .cube {
            width: 200px;
            height: 200px;
            background: #ffffff;
            border: 4px solid #333;
            border-radius: 20px;
            box-shadow: 0 8px 0 #999, 0 12px 20px rgba(0,0,0,0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 80px;
            font-weight: bold;
            color: #222;
            user-select: none;
            cursor: pointer;
            transition: transform 0.1s ease;
        }
        .cube.rolling {
            animation: roll 0.6s ease-in-out;
        }
        @keyframes roll {
            0%   { transform: rotate(0deg) scale(1); }
            25%  { transform: rotate(90deg) scale(1.1); }
            50%  { transform: rotate(180deg) scale(1); }
            75%  { transform: rotate(270deg) scale(0.9); }
            100% { transform: rotate(360deg) scale(1); }
        }
        .info {
            margin-top: 30px;
            font-size: 18px;
            color: #555;
        }
    </style>
</head>
<body>
    <div style="text-align: center;">
        <div id="cube" class="cube">1</div>
        <div class="info">Нажми на кубик</div>
    </div>

    <script>
        // ★★★ ЗДЕСЬ ЗАДАЙ СВОЮ ПОСЛЕДОВАТЕЛЬНОСТЬ ★★★
        const sequence = [1, 3, 2, 3, 1, 3,];   // можно изменить на любую
        let currentIndex = -1;                // индекс текущего числа (начинаем с -1, чтобы первое нажатие дало 0)

        const cube = document.getElementById('cube');

        cube.addEventListener('click', function() {
            // 1. Запускаем анимацию вращения
            cube.classList.remove('rolling');
            // Небольшая задержка, чтобы перезапустить анимацию
            void cube.offsetWidth; // принудительный reflow
            cube.classList.add('rolling');

            // 2. Меняем число на следующее из последовательности
            currentIndex = (currentIndex + 1) % sequence.length;
            const newNumber = sequence[currentIndex];

            // Меняем текст после того, как анимация почти закончится,
            // чтобы число сменилось в момент "остановки".
            // Можно сменить сразу, но тогда число будет видно во время вращения.
            // Для большего реализма — меняем через таймер (чуть позже).
            setTimeout(() => {
                cube.textContent = newNumber;
            }, 300); // половина времени анимации (0.6s)
        });
    </script>
</body>
</html>
